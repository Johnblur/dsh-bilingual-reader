# dsh-bilingual-reader bundle layer: plain insert so DSH can apply it.
# `name` is the package entry; the loader resolves it from profile node_modules.
# (A config/expression row like `inject:` needs a restart and won't hot-mount.)
# The plugin's host/client inject + apply live in lib/index.mjs (host) and
# lib/client.mjs (client), declared by the package's `main` / `dsh.client`.
- insert:
    - id: dsh-bilingual-reader
      name: 'dsh-bilingual-reader'
